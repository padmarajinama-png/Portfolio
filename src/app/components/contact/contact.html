<section id="contact" class="contact">

  <h2>Contact Me</h2>

  <form class="contact-form">

    <input
      type="text"
      placeholder="Enter Your Name"
      required
    >

    <input
      type="email"
      placeholder="Enter Your Email"
      required
    >

    <textarea
      rows="5"
      placeholder="Enter Your Message"
      required
    ></textarea>

    <button type="submit">
      Send Message
    </button>

  </form>

</section>
